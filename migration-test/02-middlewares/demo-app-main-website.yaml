---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: main-website-rate-limit
  namespace: demo-app
spec:
  rateLimit:
    average: 50
    burst: 50
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: main-website-cors
  namespace: demo-app
spec:
  headers:
    accessControlAllowMethods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
    accessControlAllowOriginList:
      - "https://example.com,https://www.example.com"
    accessControlMaxAge: 86400
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: main-website-redirect-https
  namespace: demo-app
spec:
  redirectScheme:
    scheme: https
    permanent: true