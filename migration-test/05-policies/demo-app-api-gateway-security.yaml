apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: api-gateway-ext-auth
  namespace: demo-app
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: api-gateway
  extAuth:
    http:
      backendRef:
        name: auth-service
        port: 80
      path: "https://auth.example.com/verify"
      headersToBackend:
        - "X-Auth-User"
        - "X-Auth-Role"
