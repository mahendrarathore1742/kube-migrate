apiVersion: v1
kind: Namespace
metadata:
  name: demo-app
---
# Simple echo server deployments
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
  namespace: demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-frontend
  template:
    metadata:
      labels:
        app: web-frontend
    spec:
      containers:
      - name: echo
        image: hashicorp/http-echo
        args: ["-text=Hello from web-frontend"]
        ports:
        - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: web-frontend
  namespace: demo-app
spec:
  selector:
    app: web-frontend
  ports:
  - port: 80
    targetPort: 5678
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  namespace: demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels:
        app: api-server
    spec:
      containers:
      - name: echo
        image: hashicorp/http-echo
        args: ["-text=Hello from api-server"]
        ports:
        - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: api-server
  namespace: demo-app
spec:
  selector:
    app: api-server
  ports:
  - port: 80
    targetPort: 5678
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: echo
        image: hashicorp/http-echo
        args: ["-text=Auth OK"]
        ports:
        - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: demo-app
spec:
  selector:
    app: auth-service
  ports:
  - port: 80
    targetPort: 5678
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-panel
  namespace: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-panel
  template:
    metadata:
      labels:
        app: admin-panel
    spec:
      containers:
      - name: echo
        image: hashicorp/http-echo
        args: ["-text=Admin Panel"]
        ports:
        - containerPort: 5678
