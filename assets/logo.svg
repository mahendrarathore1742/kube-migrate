<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" fill="none">
  <defs>
    <linearGradient id="kube" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#326CE5"/>
      <stop offset="100%" stop-color="#6C63FF"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6C63FF"/>
      <stop offset="100%" stop-color="#00D4AA"/>
    </linearGradient>
    <linearGradient id="target" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4AA"/>
      <stop offset="100%" stop-color="#00B894"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="800" height="200" rx="20" fill="#0a0a0a"/>
  <rect width="800" height="200" rx="20" fill="none" stroke="#1a1a2e" stroke-width="1"/>

  <!-- Kubernetes wheel icon (source) -->
  <g transform="translate(80, 100)" filter="url(#glow)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="38" fill="none" stroke="url(#kube)" stroke-width="3"/>
    <!-- Spokes -->
    <g stroke="url(#kube)" stroke-width="2.5" stroke-linecap="round">
      <line x1="0" y1="-18" x2="0" y2="-32"/>
      <line x1="15.6" y1="9" x2="27.7" y2="16"/>
      <line x1="-15.6" y1="9" x2="-27.7" y2="16"/>
      <line x1="15.6" y1="-9" x2="27.7" y2="-16"/>
      <line x1="-15.6" y1="-9" x2="-27.7" y2="-16"/>
      <line x1="0" y1="18" x2="0" y2="32"/>
    </g>
    <!-- Center hub -->
    <circle cx="0" cy="0" r="10" fill="url(#kube)" opacity="0.9"/>
    <!-- Hub dots -->
    <circle cx="0" cy="-5" r="1.5" fill="#fff"/>
    <circle cx="4.3" cy="2.5" r="1.5" fill="#fff"/>
    <circle cx="-4.3" cy="2.5" r="1.5" fill="#fff"/>
    <!-- Spoke end circles -->
    <circle cx="0" cy="-35" r="4" fill="url(#kube)"/>
    <circle cx="30.3" cy="17.5" r="4" fill="url(#kube)"/>
    <circle cx="-30.3" cy="17.5" r="4" fill="url(#kube)"/>
    <circle cx="30.3" cy="-17.5" r="4" fill="url(#kube)"/>
    <circle cx="-30.3" cy="-17.5" r="4" fill="url(#kube)"/>
    <circle cx="0" cy="35" r="4" fill="url(#kube)"/>
  </g>

  <!-- Migration arrow -->
  <g filter="url(#glow)">
    <path d="M 135 100 C 170 100, 170 85, 195 85" stroke="url(#arrow)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 135 100 C 170 100, 170 115, 195 115" stroke="url(#arrow)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Arrow heads -->
    <polygon points="195,80 205,85 195,90" fill="#00D4AA"/>
    <polygon points="195,110 205,115 195,120" fill="#00D4AA"/>
  </g>

  <!-- Target icon (Gateway/Route symbol) -->
  <g transform="translate(230, 100)" filter="url(#glow)">
    <circle cx="0" cy="-15" r="12" fill="none" stroke="url(#target)" stroke-width="2.5"/>
    <circle cx="0" cy="-15" r="5" fill="url(#target)" opacity="0.8"/>
    <circle cx="0" cy="15" r="12" fill="none" stroke="url(#target)" stroke-width="2.5"/>
    <circle cx="0" cy="15" r="5" fill="url(#target)" opacity="0.8"/>
  </g>

  <!-- Text: kube-migrate -->
  <text x="280" y="92" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="48" font-weight="800" letter-spacing="-1">
    <tspan fill="#ffffff">kube</tspan><tspan fill="#555">-</tspan><tspan fill="url(#arrow)">migrate</tspan>
  </text>

  <!-- Tagline -->
  <text x="282" y="128" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#666" font-weight="400" letter-spacing="0.5">
    Scan · Analyze · Migrate your Kubernetes Ingress
  </text>
</svg>
