name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Go mod download
        run: go mod download

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Install frontend deps
        run: cd web && npm ci

      - name: Build frontend
        run: cd web && npx vite build

      - name: Build binary
        run: go build -o kube-migrate .

      - name: Smoke test
        run: ./kube-migrate --help

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
